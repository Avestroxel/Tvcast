    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Cross-device browser and media remote control system connecting phones, tablets, PCs, and Smart TVs via instant QR or 6-digit pairing." />
    <meta property="og:title" content="CastSync - Cross-Device Browser & Media Remote" />
    <meta property="og:description" content="Cross-device browser and media remote control system connecting phones, tablets, PCs, and Smart TVs via instant QR or 6-digit pairing." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CastSync" />
    <script>
      // Cleanly handle Vite HMR WebSocket in AI Studio container environment
      (function() {
        // Intercept Vite HMR WebSockets to prevent closed-without-opened rejections
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isVite = (typeof url === 'string') && (
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              url.indexOf(':24678') !== -1 ||
              url.indexOf('token=') !== -1
            );
            if (isVite) {
              var listeners = {};
              var mockWs = {
                readyState: 1, // OPEN
                url: url,
                protocol: protocols || '',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {
                  mockWs.readyState = 3;
                  if (listeners['close']) {
                    listeners['close'].forEach(function(cb) { cb({ wasClean: true, code: 1000, reason: '' }); });
                  }
                },
                addEventListener: function(event, cb) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(cb);
                  if (event === 'open') {
                    setTimeout(function() { cb({ type: 'open' }); }, 15);
                  }
                },
                removeEventListener: function(event, cb) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(fn) { return fn !== cb; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              setTimeout(function() {
                if (typeof mockWs.onopen === 'function') mockWs.onopen({ type: 'open' });
              }, 15);
              return mockWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        // Suppress any stray WebSocket rejections or console errors from Vite client
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (str.indexOf('WebSocket') !== -1 && (str.indexOf('closed without opened') !== -1 || str.indexOf('[vite]') !== -1)) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var str = (event && event.reason) ? (event.reason.message || String(event.reason)) : '';
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) ? event.message : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

</html>
